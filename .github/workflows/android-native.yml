name: Validate and build native SANAD Android
on:
  push:
    branches: [codex/sanad-native-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and analyze native changes
        run: |
          dart format lib test
          flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Validate marketplace and mobile bridge
        run: node --test worker/test/*.test.mjs mobile-api/test/*.test.mjs scripts/test/android-config.test.mjs
      - name: Prepare public client configuration
        id: config
        shell: bash
        run: |
          if test -f config/android.json; then
            node scripts/check-sanad-android.mjs config/android.json
            echo 'deliver=true' >> "$GITHUB_OUTPUT"
            echo 'path=config/android.json' >> "$GITHUB_OUTPUT"
          else
            echo 'deliver=false' >> "$GITHUB_OUTPUT"
            echo 'path=build-validation.json' >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"MARKETPLACE_API_URL":"https://example.invalid"}' > build-validation.json
            echo 'Compile validation only: Android Firebase registration and reachable API are still required.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compile real Flutter Android ARM64 app
        run: flutter build apk --profile --target-platform android-arm64 --build-name 1.0.1 --build-number 2 --dart-define-from-file=${{ steps.config.outputs.path }}
      - name: Verify native engine and application payload
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-profile.apk') as apk:
              assert apk.testzip() is None
              assert 'lib/arm64-v8a/libflutter.so' in apk.namelist()
              assert 'lib/arm64-v8a/libapp.so' in apk.namelist()
          PY
      - name: Prepare tested installable APK
        if: steps.config.outputs.deliver == 'true'
        shell: bash
        run: |
          mkdir -p apk-output
          cp build/app/outputs/flutter-apk/app-profile.apk apk-output/SANAD_1.0.1_Android_ARM64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apk-output/SANAD_1.0.1_Android_ARM64.apk
          sha256sum apk-output/*.apk > apk-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.config.outputs.deliver == 'true'
        with:
          name: SANAD-Native-Android-APK
          path: apk-output/
          retention-days: 30
      - name: Collect formatting changes
        if: always()
        run: |
          mkdir -p validation-output
          git diff -- lib test > validation-output/formatted-source.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: SANAD-Native-Validation
          path: validation-output/
          retention-days: 7
