name: Build SANAD Android preview APK
on:
  push:
    branches: [codex/sanad-android-preview]
    paths:
      - android-preview/**
      - .github/workflows/android-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build and check preview APK
        run: gradle --no-daemon -p android-preview :app:assembleDebug :app:lintDebug
      - name: Verify signature and package metadata
        shell: bash
        run: |
          mkdir -p apk-output
          cp android-preview/app/build/outputs/apk/debug/app-debug.apk apk-output/SANAD_Mobile_Preview_1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apk-output/SANAD_Mobile_Preview_1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging apk-output/SANAD_Mobile_Preview_1.0.apk > apk-output/package-info.txt
          grep -q "package: name='com.salamoon.sanad.preview'" apk-output/package-info.txt
          grep -q "sdkVersion:'23'" apk-output/package-info.txt
          sha256sum apk-output/SANAD_Mobile_Preview_1.0.apk > apk-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SANAD-Mobile-Preview-APK
          path: apk-output/
          if-no-files-found: error
          retention-days: 30
